<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>さいとう内科クリニック</title>
<style>
:root{--main:#2C5E88;--sub:#4a423f;--mainL:#eaf1f7;}
body{margin:0;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
     color:#1c1a19;line-height:1.9;font-size:17px;background:#fff}
.wrap{max-width:640px;margin:0 auto;padding:80px 24px}
h1{font-size:24px;color:var(--main);margin:0 0 24px}
p{margin:16px 0;color:var(--sub)}
.box{background:var(--mainL);border-radius:12px;padding:20px 24px;margin-top:32px;font-size:16px}
</style>
</head>
<body>
<div class="wrap">
<h1>さいとう内科クリニック</h1>
<p>このページは、当院で患者さんにお渡ししている解説ページの入口です。</p>
<div class="box">
<p style="margin:0">解説ページは、診察時にお渡しするリーフレットの
<b>QRコード</b>から直接ひらいてください。</p>
</div>
</div>
</body>
</html>
